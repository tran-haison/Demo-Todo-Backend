steps:
  - name: 'gcr.io/cloud-builders/git'
    args:
      - 'clone'
      - '${_GITHUB_REPO_URL}'
      - '/workspace/repo-src'

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'echo "${_DOCKERHUB_TOKEN}" | docker login -u "${_DOCKERHUB_USERNAME}" --password-stdin'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_DOCKERHUB_USERNAME}/${_IMAGE}:${_IMAGE_TAG}'
      - '/workspace/repo-src'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_DOCKERHUB_USERNAME}/${_IMAGE}:${_IMAGE_TAG}'

options:
  logging: NONE

substitutions:
  _GITHUB_REPO_URL: 'https://github.com/tran-haison/Demo-Todo-Backend.git'
  _DOCKERHUB_USERNAME: 'sonth2501'
  _DOCKERHUB_TOKEN: 'SET_AT_RUNTIME_IN_CLOUD_SHELL'
  _IMAGE: 'todo-backend'
  _IMAGE_TAG: 'latest'
